<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Can't reach the server</title>
<style>
  :root { --paper: #f6f2ea; --ink: #2b2a26; --muted: #6b675d; --green: #285846; }
  @media (prefers-color-scheme: dark) { :root { --paper: #1c1b18; --ink: #ece8dd; --muted: #a29d8f; --green: #7fc3a3; } }
  body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; display: grid; place-items: center; padding: 24px; }
  main { max-width: 420px; }
  h1 { font: 500 30px/1.15 Georgia, serif; margin: 0 0 10px; }
  p { color: var(--muted); }
  a, button { display: block; width: 100%; margin-top: 12px; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--green); background: transparent; color: var(--green); font: inherit; font-weight: 600; text-align: center; text-decoration: none; }
  button.primary { background: var(--green); color: var(--paper); }
</style>
</head>
<body>
<main>
  <h1>Can't reach your server</h1>
  <p>Check that the server is running, that this phone can reach its address, and that you are online.</p>
  <button class="primary" onclick="location.href='index.html'">Try again</button>
  <a href="index.html?change=1">Change server address</a>
</main>
</body>
</html>
